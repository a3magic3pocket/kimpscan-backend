server {
    listen 80 default_server;

    server_name _;

    # ACME challenge 파일을 위한 예외 처리
    location /.well-known/acme-challenge/ {
        root /var/www/html;  # 인증 파일을 이 경로에 배치합니다
        try_files $uri =404;  # 요청된 파일이 없다면 404 오류를 반환
    }

    # 모든 HTTP 요청을 HTTPS로 리디렉션
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name clarify.kr;
    underscores_in_headers on;
    server_tokens off;
    #ignore_invalid_headers off;

    ssl_certificate /etc/ssl/live/fullchain1.pem;
    ssl_certificate_key /etc/ssl/live/privkey1.pem;

    location / {
        proxy_set_header    host    $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_pass_request_headers  on;
        proxy_pass  http://kimpscan:8080;
    }

    location /ws {
        proxy_pass http://kimpscan:8080/ws;  # WebSocket 서버가 실행되는 내부 주소
        proxy_http_version 1.1;

        # WebSocket에 필요한 헤더들
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 클라이언트의 쿠키 전달
        proxy_set_header Cookie $http_cookie;

        # WebSocket 연결을 위한 추가 설정 (선택 사항)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers  on;
    }
}