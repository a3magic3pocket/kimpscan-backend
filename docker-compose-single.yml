version: '3.8'

services:
  nginx:
    image: nginx:1.25.3-alpine
    container_name: nginx
    ports:
      - 80:80
      - 443:443
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - /etc/letsencrypt/live/clarify.kr/fullchain.pem:/etc/ssl/live/fullchain1.pem
      - /etc/letsencrypt/live/clarify.kr/privkey.pem:/etc/ssl/live/privkey1.pem
      - ./z_certbot:/var/www/html
    networks:
      - docker_net
    mem_limit: 128m # 최소 256MB RAM 보장
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - kimpscan

  kimpscan:
    image: openjdk:21-jdk-slim  # JDK 21 이미지를 사용
    container_name: kimpscan
    restart: always
    volumes:
      - ./api-0.0.1-SNAPSHOT.jar:/api-0.0.1-SNAPSHOT.jar  # 로컬 JAR 파일을 컨테이너에 매핑
    command: [ "java", "-Xmx350m", "-jar", "/api-0.0.1-SNAPSHOT.jar" ]  # JAR 파일 실행
    networks:
      - docker_net
    mem_limit: 500m # 최소 256MB RAM 보장
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

configs:
  nginx-config:
    file: "./nginx-single.conf"

networks:
  docker_net:
    driver: bridge
