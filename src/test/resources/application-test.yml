spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/testdb
    username: root
    password: test
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
    min-response-size: 1024

app:
  auth:
    origin: "http://localhost:8080"
    success-url: "http://localhost:8080/auth-success.html"
    failure-url: "http://localhost:8080/auth-failure.html"
  jwt:
    secret-key: "aGVsbG8td29ybGQtaGVsbG8td29ybGQtaGVsbG8td29ybGQtaGVsbG8td29ybGQ="
    access-expiration-time: 3600
    refresh-expiration-time: 3600
