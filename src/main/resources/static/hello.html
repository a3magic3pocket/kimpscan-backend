<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <title>DOM Loaded Example</title>
</head>
<body>
<h1 id="message">로드 중...</h1>
<button onclick="connect()">김프 티커 연결</button>
<button onclick="connectMovingAvg()">김프 이동평균 연결</button>
<button id="init-tickers">최초 김프 티커 api 호출 </button>
<button id="init-moving-avg">최초 김프 이동평균 api 호출 </button>
</body>
<script>

    // WebSocket 연결
    function connect() {
        socket = new WebSocket('ws://localhost:8080/ws/exchange/tickers'); // WebSocket 엔드포인트로 연결
        socket.onopen = function(event) {
            console.log('Connected to WebSocket');
        };

        socket.onmessage = function(event) {
            console.log('Received: ' + event.data);
        };

        socket.onerror = function(error) {
            console.error('WebSocket Error: ' + error);
        };

        socket.onclose = function(event) {
            console.log('WebSocket connection closed');
        };
    }

    // Websocket movingAvg 연결
    function connectMovingAvg() {
        socket = new WebSocket('ws://localhost:8080/ws/exchange/moving-avgs'); // WebSocket 엔드포인트로 연결
        socket.onopen = function(event) {
            console.log('Connected to WebSocket');

            socket.send("XRPUSDT");
        };

        socket.onmessage = function(event) {
            console.log('Received: ' + event.data);
        };

        socket.onerror = function(error) {
            console.error('WebSocket Error: ' + error);
        };

        socket.onclose = function(event) {
            console.log('WebSocket connection closed');
        };
    }

// DOMContentLoaded 이벤트를 사용하여 DOM이 로드된 후 코드 실행
document.addEventListener("DOMContentLoaded", function() {
    console.log("DOM이 로드되었습니다!");
    document.getElementById("message").textContent = "DOM이 성공적으로 로드되었습니다!";

    // 버튼 클릭 시 API 호출
    document.getElementById('init-moving-avg').addEventListener('click', async function() {
      try {
        const response = await fetch('http://localhost:8080/exchange/moving-avgs/init?symbol=XRPUSDT'); // 실제 API URL로 변경
        const data = await response.json();
        console.log("data", data)
      } catch (error) {
        // 오류가 발생하면 화면에 오류 메시지 표시
        console.log("error", error)
      }
    });

    // 버튼 클릭 시 API 호출
    document.getElementById('init-tickers').addEventListener('click', async function() {
      try {
        const response = await fetch('http://localhost:8080/exchange/tickers/init?symbol=XRPUSDT'); // 실제 API URL로 변경
        const data = await response.json();
        console.log("data", data)
      } catch (error) {
        // 오류가 발생하면 화면에 오류 메시지 표시
        console.log("error", error)
      }
    });
});
</script>
</html>
