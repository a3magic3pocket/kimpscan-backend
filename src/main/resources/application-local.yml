spring:
  datasource:
    url: jdbc:h2:mem:testdb      # H2 인메모리 DB URL
    driver-class-name: org.h2.Driver
    username: sa                 # 기본 사용자
    password:                    # 기본 비밀번호 (빈 값)
  h2:
    console:
      enabled: true              # H2 콘솔 활성화
      path: /h2-console          # H2 콘솔 접속 경로
  jpa:
    hibernate:
      ddl-auto: none # 아무 것도 하지 않도록 설정
    show-sql: true               # 실행되는 SQL 로그 출력
    properties:
      hibernate:
        format_sql: true # SQL 포맷을 읽기 쉽게 출력
  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/plain
    min-response-size: 1024

app:
  auth:
    origin: "http://localhost:8080"
    success-url: "http://localhost:8080/auth-success.html"
    failure-url: "http://localhost:8080/auth-failure.html"
  jwt:
    secret-key: "aGVsbG8td29ybGQtaGVsbG8td29ybGQtaGVsbG8td29ybGQtaGVsbG8td29ybGQ="
    access-expiration-time: 3600
    refresh-expiration-time: 3600


